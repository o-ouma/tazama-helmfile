# helmfile.d/admin-service.yaml
releases:
  # Another microservice
  - name: auth-service
    namespace: processor
    # When using OCI, the full URI must be specified in the chart field.
    chart: oci://docker.io/booora/auth-service-helm
    version: 4.0.0
    installed: {{ .Values.auth-service.installAuthService | default true }}
    values:
      - ../values/auth-service.yaml
    needs:
      - postgresql