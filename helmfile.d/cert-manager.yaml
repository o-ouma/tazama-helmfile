repositories:
  - name: jetstack
    url: https://charts.jetstack.io

releases:
  - name: cert-manager
    namespace: processor
    chart: jetstack/cert-manager
    version: v1.17.2
    createNamespace: true
    values:
      - ../values/cert-manager-values.yaml

    hooks:
      - events:
          - postsync
        showlogs: true
        command: kubectl
        args:
          - apply
          - --filename
          - "{{ .Environment.BaseDir }}/manifests/clusterissuer.yaml"