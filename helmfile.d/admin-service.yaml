# helmfile.d/admin-service.yaml
releases:
  # Another microservice
  - name: admin-service
    namespace: processor
    # When using OCI, the full URI must be specified in the chart field.
    chart: oci://docker.io/booora/admin-service-helm
    version: 4.0.0
    installed: {{ if hasKey .Values "admin-service" }}{{ index .Values "admin-service" "installAdminService" | default true }}{{ else }}true{{ end }}
    values:
      - ../values/admin-service.yaml
    needs:
      - postgresql
      - valkey
      - nats