name: Deploy All Services

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Helmfile
        # Official helmfile/setup-helmfile-action for better support and stability.
        uses: helmfile/setup-helmfile-action@v1
        with:
          helmfile-version: 0.148.0 # Pinning version for reproducible builds

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3
        with:
          config-file: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Login to OCI Registry (Docker Hub)
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy all charts
        run: helmfile apply
