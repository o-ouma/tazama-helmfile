name: Deploy All Services

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3
        with:
          config-file: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Login to OCI Registry (Docker Hub)
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy all charts
        # Using the official helmfile-action is more robust than manual installation scripts.
        # It handles setup of helm and helmfile, and runs the specified command.
        uses: helmfile/helmfile-action@v2.3.1
        with:
          helmfile-version: 'v0.160.0'
          # Pinning the Helm version to a known compatible release to avoid breaking changes.
          helm-version: 'v3.13.3'
          # The helm-diff plugin is useful for seeing changes before they are applied.
          helm-plugins: 'https://github.com/databus23/helm-diff@v3.8.1'
          helmfile-args: 'apply'
