name: Deploy All Services

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Install Helmfile
        run: |
          HELMFILE_VERSION="v0.148.0"
          wget "https://github.com/helmfile/helmfile/releases/download/${HELMFILE_VERSION}/helmfile_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64" -O /usr/local/bin/helmfile
          chmod +x /usr/local/bin/helmfile

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3
        with:
          config-file: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Login to OCI Registry (Docker Hub)
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy all charts
        run: helmfile apply
