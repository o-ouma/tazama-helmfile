# Define the repositories where your charts are stored.
# In your case, it's an OCI registry on Docker Hub.
repositories:
  - name: booora
    url: oci://docker.io/booora
    type: oci

  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts

# Load values files at the top level to make them available for templating.
values:
  - ./values/tms-service.yaml
  - ./values/admin-service.yaml

# Set default Helm options for all releases.
# These can be overridden on a per-release basis if needed.
helmDefaults:
  # --atomic: If set, the installation process deletes the installation on failure.
  atomic: true
  # --wait: If set, will wait until all Pods, PVCs, Services, and minimum number of Pods of a
  # Deployment, StatefulSet, or ReplicaSet are in a ready state before marking the release as successful.
  wait: true
  # --timeout: Time in seconds to wait for any individual Kubernetes operation (like Jobs for hooks).
  timeout: 900
  # --cleanup-on-fail: Allow deletion of new resources created in this upgrade when the upgrade fails.
  cleanupOnFail: true

# Define all the applications (releases) you want to deploy.
releases:
  # The TMS service from your current project
  - name: tms-service
    namespace: processor
    chart: booora/tms-service
    version: 0.1.0 # Pin the chart version for consistency
    # Conditionally install this chart. The installation can be controlled by setting
    # 'installTmsService' in the values. By default, it's set to 'true'.
    installed: {{ .Values.installTmsService | default true }}
    values:
      - ./values/tms-service.yaml # Path to specific values for this service

  # Another microservice
  - name: admin-service
    namespace: tazama-admin
    chart: booora/admin-service
    version: 0.2.0
    installed: {{ .Values.installUserService | default true }}
    values:
      - ./values/admin-service.yaml

  # A third-party chart, like Prometheus
  - name: prometheus
    namespace: monitoring
    chart: prometheus-community/prometheus
    version: 15.5.3
    values:
      - ./values/prometheus.yaml
