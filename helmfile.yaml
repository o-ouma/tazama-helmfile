# Define the repositories where your charts are stored.
repositories:
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: postgresql
    url: https://groundhog2k.github.io/helm-charts/
  - name: valkey
    url: https://valkey.io/valkey-helm
  - name: nats
    url: https://nats-io.github.io/k8s/helm/charts/

# Load values files at the top level to make them available for templating.
values:
  - ./values/tms-service.yaml
  - ./values/admin-service.yaml
  - ./values/auth-service.yaml
  - ./values/valkey.yaml
  - ./values/nats.yaml
  - ./values/postgresql.yaml

# Set default Helm options for all releases.
# These can be overridden on a per-release basis if needed.
helmDefaults:
  # --atomic: If set, the installation process deletes the installation on failure.
  atomic: true
  # --wait: If set, will wait until all Pods, PVCs, Services, and minimum number of Pods of a
  # Deployment, StatefulSet, or ReplicaSet are in a ready state before marking the release as successful.
  wait: true
  # --timeout: Time in seconds to wait for any individual Kubernetes operation (like Jobs for hooks).
  timeout: 900
  # --cleanup-on-fail: Allow deletion of new resources created in this upgrade when the upgrade fails.
  cleanupOnFail: true

# Load infrastructure before the services that depend on it. Cross-file
# `needs` references are not resolved between separate sub-Helmfiles.
helmfiles:
  - helmfile.d/postgresql.yaml
  - helmfile.d/valkey.yaml
  - helmfile.d/nats.yaml
  - helmfile.d/tms-service.yaml
  - helmfile.d/admin-service.yaml
  - helmfile.d/auth-service.yaml
